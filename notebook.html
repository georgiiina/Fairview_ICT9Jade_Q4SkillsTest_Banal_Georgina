<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>My Notebooks</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { 
            background: url('https://i.pinimg.com/originals/5c/43/d2/5c43d280ddfbd4a1b4c571874e699f8d.gif') no-repeat center center fixed; 
            background-size: cover;
            font-family: 'Segoe UI', sans-serif;
        }

        .sidebar { 
            background: rgba(255, 182, 193, 0.9); 
            min-height: 100vh; 
            padding: 30px 20px; 
            border-right: 3px solid #ff69b4;
            backdrop-filter: blur(10px);
        }


        .pfp-small {
            width: 80px;
            height: 80px;
            background-color: white;
            border: 2px solid #ff69b4;
            border-radius: 50%;
            margin: 0 auto 15px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .pfp-small img { width: 70%; opacity: 0.5; }

 
        .main-content {
            background: rgba(255, 255, 255, 0.85);
            margin: 20px;
            border-radius: 20px;
            padding: 30px;
            min-height: 90vh;
        }

        .notebook-card { 
            border: none;
            border-bottom: 5px solid #ff69b4; 
            border-radius: 15px; 
            padding: 20px; 
            background: white;
            transition: 0.3s;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .notebook-card:hover { 
            transform: translateY(-10px);
            background-color: #fff0f5;
        }

        .notebook-card h3 { color: #ff1493; font-size: 1.5rem; }
        .nav-link { color: #333; font-weight: 500; border-radius: 10px; margin-bottom: 5px; }
        .nav-link:hover { background: rgba(255, 255, 255, 0.5); color: #ff1493; }
    </style>
</head>
<body>

<div class="container-fluid">
    <div class="row">
        <nav class="col-md-2 sidebar text-center">
            <div class="pfp-small">
                <img src="https://www.svgrepo.com/show/452030/avatar-default.svg" alt="pfp">
            </div>
            <h5 style="color: #ff1493;">Hi, Georgina!</h5>
            <hr>
            <ul class="nav flex-column text-start">
                <li class="nav-item"><a class="nav-link" href="#">🌸 Dashboard</a></li>
                <li class="nav-item"><a class="nav-link" href="#">📚 My Tasks</a></li>
                <li class="nav-item"><a class="nav-link" href="#">⚙️ Settings</a></li>
                <li class="nav-item mt-5"><a class="nav-link text-danger" href="index.html">🚪 Logout</a></li>
            </ul>
        </nav>

        <main class="col-md-10">
            <div class="main-content">
                <div class="d-flex justify-content-between align-items-center">
                    <h1 style="color: #ff69b4; font-weight: bold;">My Virtual Notebooks</h1>
                    <span class="badge rounded-pill" style="background-color: #ff69b4;">AY 2025-2026</span>
                </div>
                <p class="text-muted">Pick a subject to continue your progress.</p>
                <hr>

                <div class="row g-4">
                    <div class="col-md-4">
                        <div class="notebook-card"><h3>Filipino</h3><p class="mb-0">Ms. Francisco</p></div>
                    </div>
                    <div class="col-md-4">
                        <div class="notebook-card"><h3>English</h3><p class="mb-0">Ms. Avila</p></div>
                    </div>
                    <div class="col-md-4">
                        <div class="notebook-card"><h3>Math</h3><p class="mb-0">Mr. Ramos</p></div>
                    </div>
                    <div class="col-md-4">
                        <div class="notebook-card"><h3>Science</h3><p class="mb-0">Ms. Talavera</p></div>
                    </div>
                    <div class="col-md-4">
                        <div class="notebook-card"><h3>Social Studies</h3><p class="mb-0">Mr. Fernandez</p></div>
                    </div>
                    <div class="col-md-4">
                        <div class="notebook-card"><h3>Values Ed</h3><p class="mb-0">Mr. Buntile</p></div>
                    </div>
                </div>

                <footer class="mt-5 pt-4 text-center border-top">
                    <p id="footer-quotes" style="color: #ff69b4; font-style: italic;"></p>
                </footer >
            </div>
        </main>
    </div>
</div>

<script>
    
    for (let i = 0; i < quotes.length; i++) {
        footerContent += quotes[i] + (i < quotes.length - 1 ? " ✨ " : "");
    }
    
    document.getElementById("footer-quotes").innerHTML = footerContent;
</script>

</body>
</html>
